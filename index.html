<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Asmita Gharti | Student Portfolio</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f5f7fb;
        }

        /* Navigation */
        nav {
            background: #1e293b;
            padding: 15px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        nav h2 {
            color: white;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 25px;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        nav ul li a:hover {
            color: #38bdf8;
        }

        /* Hero Section */
        .hero {
            min-height: 90vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 20px;
            background: linear-gradient(135deg, #0f172a, #2563eb);
            color: white;
        }

        .hero-content h1 {
            font-size: 55px;
            margin-bottom: 10px;
        }

        .hero-content h1 span {
            color: #38bdf8;
        }

        .hero-content h3 {
            font-size: 25px;
            margin-bottom: 15px;
        }

        .hero-content p {
            max-width: 650px;
            margin: auto;
            font-size: 18px;
            color: #e2e8f0;
        }

        .btn {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 25px;
            background: #38bdf8;
            color: #0f172a;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
        }

        .btn:hover {
            background: white;
        }

        /* General Sections */
        section {
            padding: 70px 8%;
        }

        .section-title {
            text-align: center;
            margin-bottom: 40px;
            font-size: 35px;
            color: #1e293b;
        }

        /* About */
        .about {
            background: white;
        }

        .about-content {
            max-width: 800px;
            margin: auto;
            text-align: center;
            font-size: 18px;
        }

        /* Skills */
        .skills-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
        }
